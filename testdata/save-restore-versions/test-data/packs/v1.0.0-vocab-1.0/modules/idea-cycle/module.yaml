# 学習モジュール idea-cycle: 企画 repo で題材の工程（CH-2 の ST-2.1〜ST-2.8）。
# 周回ごとに実体化する（PoC-4）。実体ごとの違いは引数で渡す: idea（題材の名前と成果物の経路）、
# do_new_idea（ST-2.1 の `do` の文）。
# PoC-3 の CH-2（format-b の chapters/ch02-idea-cycle/chapter.yaml、c9291b9c8）との差は次の 4 点だけ。
#   (1) 章からモジュールにした（starts は章の starts からモジュールの starts へ）。
#   (2) 題材の名前 bbs-with-login と、模擬 PoC の結果の経路を、引数 ${idea} にした。
#   (3) ST-2.1 の `do` を引数 ${do_new_idea} にした（案内レベル B で skill 名を伏せるため）。
#   (4) ST-2.1 の本文に、案内レベル B の版（st-2-1.b.md）を足した。
id: idea-cycle
title: 企画 repo で題材の工程

params:
  idea: bbs-with-login
  do_new_idea: /new-idea に kebab-case の名前を付けて送ります

# 途中開始（モジュールの starts。語彙 v1。実体ごとに <実体 ID>#<開始 ID> として展開する）。開始用の世界状態は状態変化の語彙で書く。
starts:
  - { id: s-2-1, node: st-2-1 }
  - { id: s-2-2, node: st-2-2 }
  - id: s-2-3
    node: st-2-3
    effects:
      - put: { path: "ideas/${idea}/README.md", fixture: fx-kakuu-bbs-readme, attrs: { status: ブレスト } }
      - put: { path: "ideas/${idea}/01-brainstorm.md", fixture: fx-kakuu-brainstorm, attrs: { sections: filled } }
  - id: s-2-4
    node: st-2-4
    effects:
      - put: { path: "ideas/${idea}/README.md", fixture: fx-kakuu-bbs-readme, attrs: { status: PoC計画 } }
      - put: { path: "ideas/${idea}/01-brainstorm.md", fixture: fx-kakuu-brainstorm, attrs: { sections: filled } }
  - id: s-2-5
    node: st-2-5
    effects:
      - put: { path: "ideas/${idea}/README.md", fixture: fx-kakuu-bbs-readme, attrs: { status: PoC計画 } }
      - put: { path: "ideas/${idea}/01-brainstorm.md", fixture: fx-kakuu-brainstorm, attrs: { sections: filled } }
      - put: { path: "ideas/${idea}/02-poc-plan.md", fixture: fx-kakuu-poc-plan }
  - id: s-2-6
    node: st-2-6
    effects:
      - put: { path: "ideas/${idea}/README.md", fixture: fx-kakuu-bbs-readme, attrs: { status: ビヘイビア定義 } }
      - put: { path: "ideas/${idea}/02-poc-plan.md", fixture: fx-kakuu-poc-plan }

steps:
  # ST-2.1 /new-idea で題材のアイデアを作る（kebab-case でない名前は拒否）
  - id: st-2-1
    title: 題材のアイデアを作る
    do: "${do_new_idea}"
    body: st-2-1.md
    body_levels: { B: st-2-1.b.md }
    lo: [LO-2]
    views: [v-files]
    fixtures: [fx-kakuu-bbs-readme]
    hints: [h-2-1-1, h-2-1-2, h-2-1-3]
    on_reject: { bad_arg_shape: rj-2-1-kebab }
    next: [{ to: st-2-2 }]
    input:
      kind: command
      name: new-idea
      args:
        - { name: name, positional: true, required: true, shape: kebab_case }
    rules:
      - id: r-create
        on: { command: new-idea, args: { name: "${idea}" } }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/README.md", fixture: fx-kakuu-bbs-readme, attrs: { status: ブレスト } }
    confirm:
      kind: point_at
      targets: [{ view: v-files, path: "ideas/${idea}/README.md" }]
      on_miss: rj-miss-point

  # ST-2.2 ブレインストーミングの工程（自然文。AI 役の生成は処理中）
  - id: st-2-2
    title: ブレインストーミングの工程
    do: 企画の狙いを文で書いて送ります
    body: st-2-2.md
    lo: [LO-2]
    views: [v-doc]
    fixtures: [fx-kakuu-brainstorm]
    on_enter: [{ clear_flag: hold }]
    processing:
      - { name: gen-heading }
      - { name: gen-body }
      - name: gen-done
        effects:
          - set_attr: { path: "ideas/${idea}/01-brainstorm.md", attr: sections, value: filled }
    next: [{ to: st-2-3 }]
    input: { kind: text, min: 10, max: 2000 }
    rules:
      - id: r-write
        on: { text: true }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/01-brainstorm.md", fixture: fx-kakuu-brainstorm, attrs: { sections: drafting } }
    confirm:
      kind: answer
      on_wrong: rj-wrong-answer
      options:
        - { id: ans-login-first, correct: true }
        - { id: ans-search-first, correct: true }

  # ST-2.3 追求判定（承認・差し戻し。保留を選ぶと ST-2.2 へ戻る）
  - id: st-2-3
    title: 追求判定
    do: 承認の操作で、追求判定に答えます
    body: st-2-3.md
    lo: [LO-3]
    views: [v-doc]
    hints: [h-2-3-1, h-2-3-2, h-2-3-3]
    next:
      - { to: st-2-2, when: { flag: hold } }
      - { to: st-2-4 }
    input: { kind: approval }
    rules:
      - id: r-go
        on: { approval: approve }
        outcome:
          kind: accept
          effects:
            - set_attr: { path: "ideas/${idea}/README.md", attr: status, value: PoC計画 }
      - id: r-nogo
        on: { approval: reject }
        outcome: { kind: reject, rejection: rj-2-3-nogo }
      - id: r-hold
        on: { approval: revise }
        outcome: { kind: accept, effects: [{ set_flag: hold }] }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: "ideas/${idea}/README.md#status" }]
      on_miss: rj-miss-point

  # ST-2.4 PoC 計画の工程（教材用の模擬 PoC。候補から選ぶ。確認は省くと明示）
  - id: st-2-4
    title: 検証計画の工程
    do: 検証したい候補を、選択肢から 1 つ選びます
    body: st-2-4.md
    views: [v-doc]
    fixtures: [fx-kakuu-poc-plan]
    next: [{ to: st-2-5 }]
    input:
      kind: choice
      options:
        - { id: cand-session, label: ログイン状態の保持方式 A }
        - { id: cand-token, label: ログイン状態の保持方式 B }
        - { id: cand-theme, label: 画面の配色 }
    rules:
      - id: r-session
        on: { option: cand-session }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/02-poc-plan.md", fixture: fx-kakuu-poc-plan }
            - clear_flag: variant_miss
      - id: r-token
        on: { option: cand-token }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/02-poc-plan.md", fixture: fx-kakuu-poc-plan }
            - set_flag: variant_miss
      - id: r-theme
        on: { option: cand-theme }
        outcome: { kind: reject, rejection: rj-2-4-unrelated }
    confirm:
      kind: none
      reason: 候補を選ぶこと自体が目的で、左の変化を指す学習目標がない

  # ST-2.5 PoC 実施の工程（教材用の模擬 PoC。ログは架空。基準を外れた版は戻る工程を選ぶ）
  - id: st-2-5
    title: 検証の結果を判断する
    do: 結果カードを読み、Go か戻る工程を選びます
    body: st-2-5.md
    lo: [LO-4]
    views: [v-doc]
    fixtures: [fx-kakuu-poc-log]
    on_enter:
      - when: { flag: variant_miss }
        put: { path: "ideas/${idea}/03-poc/login-session/result.md", fixture: fx-kakuu-poc-result-miss, attrs: { verdict: miss } }
      - when: { not: { flag: variant_miss } }
        put: { path: "ideas/${idea}/03-poc/login-session/result.md", fixture: fx-kakuu-poc-result-ok, attrs: { verdict: ok } }
    next:
      - { to: st-2-4, when: { chose: { step: st-2-5, option: back-poc } } }
      - { to: st-2-6 }
    input:
      kind: choice
      options:
        - { id: go, label: Go }
        - { id: nogo, label: No-Go }
        - { id: back-brainstorm, label: ブレインストーミングに戻る }
        - { id: back-poc, label: 検証計画に戻る }
    rules:
      - id: r-go-ok
        on: { option: go }
        when: { world_attr: { path: "ideas/${idea}/03-poc/login-session/result.md", attr: verdict, eq: ok } }
        outcome:
          kind: accept
          effects:
            - set_attr: { path: "ideas/${idea}/README.md", attr: status, value: ビヘイビア定義 }
      - id: r-go-miss
        on: { option: go }
        when: { world_attr: { path: "ideas/${idea}/03-poc/login-session/result.md", attr: verdict, eq: miss } }
        outcome: { kind: reject, rejection: rj-2-5-go-on-miss }
      - id: r-nogo
        on: { option: nogo }
        outcome: { kind: reject, rejection: rj-2-5-nogo }
      - id: r-back-poc-miss
        on: { option: back-poc }
        when: { world_attr: { path: "ideas/${idea}/03-poc/login-session/result.md", attr: verdict, eq: miss } }
        outcome: { kind: accept }
      - id: r-back-poc-ok
        on: { option: back-poc }
        when: { world_attr: { path: "ideas/${idea}/03-poc/login-session/result.md", attr: verdict, eq: ok } }
        outcome: { kind: reject, rejection: rj-2-5-back-on-ok }
      - id: r-back-brainstorm
        on: { option: back-brainstorm }
        outcome: { kind: reject, rejection: rj-2-5-back-far }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: "ideas/${idea}/03-poc/login-session/result.md#verdict" }]
      on_miss: rj-miss-point

  # ST-2.6 ビヘイビア定義の工程（曖昧な期待を直す差し戻し 1 件。スコープ確認）
  - id: st-2-6
    title: ビヘイビア定義の工程
    do: 曖昧な期待を直す差し戻しをします
    body: st-2-6.md
    lo: [LO-2]
    views: [v-doc]
    fixtures: [fx-kakuu-behavior]
    next: [{ to: st-2-7 }]
    input: { kind: approval }
    rules:
      - id: r-revise-expect
        on: { approval: revise, target: expect }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/04-behavior/screen-login.md", fixture: fx-kakuu-behavior }
            - set_flag: revised
      - id: r-revise-other
        on: { approval: revise }
        outcome: { kind: reject, rejection: rj-2-6-wrong-target }
      - id: r-approve-early
        on: { approval: approve }
        outcome: { kind: reject, rejection: rj-2-6-unfixed }
    confirm: { kind: approve }

  # ST-2.7 タスク分解の工程（TASK と対象ビヘイビアの対応を見る）
  - id: st-2-7
    title: タスク分解の工程
    do: タスクの一覧から TASK-1 の行を指します
    body: st-2-7.md
    lo: [LO-2]
    views: [v-tasks]
    fixtures: [fx-kakuu-tasks]
    next: [{ to: st-2-8 }]
    input:
      kind: ui_action
      targets:
        - { view: v-tasks, path: TASK-1 }
        - { view: v-tasks, path: TASK-2 }
    rules:
      - id: r-task1
        on: { ui: { view: v-tasks, path: TASK-1 } }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/05-tasks.md", fixture: fx-kakuu-tasks }
      - id: r-task2
        on: { ui: { view: v-tasks, path: TASK-2 } }
        outcome: { kind: reject, rejection: rj-2-7-wrong-row }
    confirm:
      kind: answer
      on_wrong: rj-wrong-answer
      options:
        - { id: ans-login-1, correct: true }
        - { id: ans-login-2, correct: false, on_wrong: rj-2-7-expl-login-2 }

  # ST-2.8 ロードマップの工程と着手判定
  - id: st-2-8
    title: ロードマップの工程と着手判定
    do: 承認の操作で、着手判定に答えます
    body: st-2-8.md
    final: true
    views: [v-doc]
    fixtures: [fx-kakuu-roadmap]
    input: { kind: approval }
    rules:
      - id: r-approve
        on: { approval: approve }
        outcome:
          kind: accept
          effects:
            - put: { path: "ideas/${idea}/06-roadmap.md", fixture: fx-kakuu-roadmap }
            - set_attr: { path: "ideas/${idea}/README.md", attr: status, value: 着手判定済み }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: "ideas/${idea}/README.md#status" }]
      on_miss: rj-miss-point
