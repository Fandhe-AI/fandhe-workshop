# ベース CI。
#
# ローカル（`make check`）・Git hooks（lefthook.yml）・CI が同じコマンド契約を共有する。
# CI 側で独自のチェックを定義せず、scripts/ の実体を呼ぶ（make スキルの「入口は複数でも
# 実処理の定義は一つ」）。言語固有のジョブ（fmt / lint / test / build 等）は派生リポジトリで
# 本ファイルへ追加し、必ず ci-complete の needs と ruleset の必須チェックにも追加すること。
#
# ジョブ追加・変更時は .claude/rules/github-actions.md に従う。
#
# runner: public リポジトリのため GitHub ホステッド（ubuntu-latest）を使う。
# macOS での検証が目的の test-hooks-macos だけ macos-latest を使う。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR は ref 単位で古い実行を止める。それ以外は run_id で分け、待機中の実行が置き換えられないようにする
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # PR の古い実行だけ止める（main への push は止めない）
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 検査ツールの pin の正（単一宣言点）。SHA256 は GitHub リリース資産を実際にダウンロードして
# 実測し、リリース API の digest と一致することを確認した値（2026-10-07）。
# バンプ時は VERSION と SHA256 を必ず同時に更新する。ローカルの推奨版（README）も合わせる。
env:
  EDITORCONFIG_CHECKER_VERSION: "3.6.1"
  EDITORCONFIG_CHECKER_SHA256: "cd32084fce5f3d49ba49697f362ac3a114989715c98819303247dd54c1f368b0"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  # 変更ファイルから、フックの回帰テストを macOS でも実行するかを決める（scripts/ci-changes.sh）。
  # macOS ランナーは起動待ち（実測 約 2 分）が支配的で課金も高いため、フック関連の変更が無い PR では
  # ubuntu のみにする。push と判定不能時は macOS も含める。
  # 出力 test-hooks-os（OS 名の JSON 配列文字列）は、test-hooks-macos の if: と、ci-complete が
  # test-hooks-macos の skipped を許容するかの判定の両方が読む。キー名・形式を変える場合は 3 箇所を揃える。
  changes:
    name: "changes (test-hooks macOS)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test-hooks-os: ${{ steps.detect.outputs.test-hooks-os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changes
        id: detect
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci-changes.sh

  check:
    name: "make check (editorconfig-checker + shellcheck)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（fandhe-frontend の ci.yml と同一 SHA に固定）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned lint tools
        # バージョン固定 + SHA256 検証済みのプリビルトバイナリを導入する。
        # ubuntu-latest にはプリインストールの shellcheck があるため、導入先を
        # GITHUB_PATH の先頭へ追加して pin 版を優先させる。
        # editorconfig-checker の配布物は bin/ec-linux-amd64 のため、scripts/check.sh が
        # 呼ぶコマンド名 editorconfig-checker へリネームして配置する。
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/lint-tools/bin"
          work_dir="${RUNNER_TEMP}/lint-tools/work"
          mkdir -p "${bin_dir}" "${work_dir}"
          cd "${work_dir}"

          ec_archive="ec-linux-amd64.tar.gz"
          curl -fsSLo "${ec_archive}" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/${ec_archive}"
          echo "${EDITORCONFIG_CHECKER_SHA256}  ${ec_archive}" | sha256sum -c -
          tar -xzf "${ec_archive}" bin/ec-linux-amd64
          install -m 0755 bin/ec-linux-amd64 "${bin_dir}/editorconfig-checker"

          sc_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "${sc_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc_archive}"
          echo "${SHELLCHECK_SHA256}  ${sc_archive}" | sha256sum -c -
          tar -xJf "${sc_archive}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${bin_dir}/shellcheck"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Show tool versions
        # pin 版が PATH 上で優先されていることを確認する（不一致は失敗させる）
        run: |
          set -euo pipefail
          make --version | head -n1
          editorconfig-checker --version
          shellcheck --version
          # リリースバイナリは `v3.6.1` のように v 接頭辞付きで出力する（Homebrew 版は付かない）
          actual_ec="$(editorconfig-checker --version)"
          actual_ec="${actual_ec#v}"
          actual_sc="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "${actual_ec}" = "${EDITORCONFIG_CHECKER_VERSION}" ] || { echo "::error::editorconfig-checker ${actual_ec} != ${EDITORCONFIG_CHECKER_VERSION}"; exit 1; }
          [ "${actual_sc}" = "${SHELLCHECK_VERSION}" ] || { echo "::error::shellcheck ${actual_sc} != ${SHELLCHECK_VERSION}"; exit 1; }

      - name: make check
        run: make check

  # フックスクリプト（scripts/hooks/*.sh）自体の回帰テスト（.claude/rules/git-hooks.md）。
  # テストはフックに置かず CI で実行する。外部依存は bash + git のみで、ツールの導入は不要。
  # ubuntu では常に実行する。macOS での検証は test-hooks-macos が担当する。
  # チェック名は ruleset の必須チェックが参照するため、変える場合は ruleset も同時に更新する。
  test-hooks:
    name: "hook script tests (ubuntu-latest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 実行した bash のバージョンはテスト出力の先頭行に表示される
      - name: make test-hooks
        run: make test-hooks

  # フックスクリプトの回帰テストの macOS 版。開発者の多くは macOS でフックを実行するため、BSD 系の
  # 挙動と macOS 標準の bash 3.2（lefthook は PATH 上の bash で起動する）でも検証する。
  # macOS ランナーを起動するのは、changes の出力に macos-latest が含まれる場合だけにする。
  # 不要な場合もチェック自体は skipped として報告させる。ruleset の必須チェックに登録できるように
  # するため（報告されないチェックを必須にすると、PR が待機のままマージできなくなる）。
  # ubuntu と matrix にまとめない理由: matrix ジョブをジョブ単位の if: でスキップすると、チェック名の
  # ${{ matrix.os }} が展開されず、必須チェックの名前と一致しない。静的な名前の別ジョブにする。
  # skipped の扱いは ci-complete が changes の出力と突き合わせて判定する。
  test-hooks-macos:
    name: "hook script tests (macos-latest)"
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.test-hooks-os), 'macos-latest')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 実行した bash のバージョンはテスト出力の先頭行に表示される
      - name: make test-hooks
        run: make test-hooks

      - name: test-hooks with macOS system bash 3.2
        run: /bin/bash scripts/hooks/test-hooks.sh

  # squash merge では PR タイトルがそのままコミット件名になるため、commit-msg フックと
  # 同じスクリプトで Conventional Commits 形式を検証する（フックの CI 側の対）。
  # PR タイトルは任意文字列のため、${{ }} を run へ直接展開せず env 経由でファイルへ書き出す
  # （シェルインジェクション防止）。push イベントでは skipped になる（ci-complete で明示許容）。
  pr-title:
    name: "PR title (Conventional Commits)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          msg_file="${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "${PR_TITLE}" > "${msg_file}"
          bash scripts/hooks/commit-msg-check.sh "${msg_file}"

  # 必須チェックの集約ジョブ。ruleset の必須チェックには、本ジョブを含め PR HEAD に報告される
  # 全チェックを登録する（implement-issue-tree の自動マージの条件。詳細は
  # .claude/rules/github-actions.md の「必須チェック」）。
  # ジョブを追加・改名・削除したら、needs と ruleset の両方を同じタイミングで更新すること
  # （needs から漏れると未検査のままマージ可能になる）。
  # fail-closed: success 以外は失敗とし、skipped は条件付きジョブが本来 skip されるべき状況でのみ
  # 明示的に許容する。
  # - pr-title: pull_request 以外のイベント
  # - test-hooks-macos: イベントが pull_request で、changes が success で、かつ出力 test-hooks-os を
  #   JSON として解釈した値が ["ubuntu-latest"] と等しい場合。出力の欠落・不正な JSON・それ以外の値は
  #   不合格にする。push では changes が必ず macOS を含めるため、skipped を許容しない
  # test-hooks-macos の skipped の許容はゲートの弱体化ではない。同じ条件で macOS のジョブ自体が
  # 生成されず未報告だったものを、skipped として報告させるだけで、許容する範囲は changes の出力と
  # 突き合わせて「skip が正しい状況」に限定している。
  ci-complete:
    name: ci-complete
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - check
      - test-hooks
      - test-hooks-macos
      - pr-title
    steps:
      - name: 全ジョブ結果の検証
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "${RESULTS}" | jq -e --arg ev "${EVENT_NAME}" '
            . as $n
            | (
                $ev == "pull_request"
                and $n.changes.result == "success"
                and (try ($n.changes.outputs["test-hooks-os"] | fromjson) catch null) == ["ubuntu-latest"]
              ) as $macos_skip_ok
            | to_entries
            | map(select((
                .value.result == "success"
                or (.key == "pr-title" and .value.result == "skipped" and $ev != "pull_request")
                or (.key == "test-hooks-macos" and .value.result == "skipped" and $macos_skip_ok)
              ) | not))
            | length == 0
          ' > /dev/null
