# 内側の学習モジュール。他のモジュールを呼ばない。
id = "mod-inner"
title = "内側のモジュール"

[[steps]]
id = "u-a"
title = "内側の入口"
next = [{ to = "u-loop" }]
input = { kind = "choice", options = [{ id = "opt-u-a", label = "読みました" }] }
rules = [{ id = "r-u-a", on = { option = "opt-u-a" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "u-loop"
title = "外側へ戻る"
use = { module = "mod-outer", instance = "in2", args = {} }
next = [{ to = "u-b" }]

[[steps]]
id = "u-b"
title = "内側の出口"
final = true
