      - { choice: fc-empty, expect: accepted }
      - { choice: ans-4-ok, expect: achieved }
      - { ui: "v-doc review/deadline", expect: accepted }
      - { choice: ans-5-ok, expect: achieved }
      - { choice: dl-tomorrow, expect: accepted }
      - { ui: "v-doc review/deadline", expect: achieved }
      - { choice: rv-check, expect: accepted }
      - { choice: ans-7-ok, expect: achieved }
      - { choice: act-send, expect: accepted }
