# 欠陥 C03: 内側のモジュールが 3 つ目のモジュールを呼び、その先が外側へ戻る。
id: mod-inner
title: 内側のモジュール

steps:
  - id: u-a
    title: 内側の入口
    next: [{ to: u-relay }]
    input: { kind: choice, options: [{ id: opt-u-a, label: 読みました }] }
    rules:
      - { id: r-u-a, on: { option: opt-u-a }, outcome: { kind: accept } }
    confirm: { kind: none, reason: 読むだけの Step のため、選んだこと自体を達成とする。 }

  - id: u-relay
    title: 中継を呼ぶ
    use: { module: mod-relay, instance: in-relay, args: {} }
    next: [{ to: u-b }]

  - id: u-b
    title: 内側の出口
    final: true
