# env-action-pack（形式 B）。保存・書き出しを Step の入力として宣言する語 env_action（PACK-34・D-69）の試験用。架空の内容だけを持つ。
pack: {id: env-action-pack, title: 保存と書き出しの入力, version: '0.0.1', ir_format: 1, guidance: A, vocab: '1.5'}
views:
  v-cards: {kind: card_list}
rejections:
  rj-default: {category: not_in_this_step, message: この Step では、その操作は使いません。, next_action: 今の Step の目的を読み直します。}
defaults:
  not_in_this_step: rj-default
