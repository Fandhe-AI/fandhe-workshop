# fandhe-workshop の Cargo ワークスペース（仮想 manifest）。
#
# crate 構成と依存の向きの正は docs/architecture.md（構成設計の版 1）。
# 依存の向きは `make check-deps`（scripts/check-crate-deps.sh）が機械で守る。
[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/core",
    "crates/pack",
    "crates/web",
]
# web を外すのは、wasm32 向けの依存を素の `cargo test` に引き込まないため。
# web を含めるときは `--workspace` を付ける。
default-members = [
    "crates/contract",
    "crates/core",
    "crates/pack",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-workshop"
publish = false

[workspace.dependencies]
fandhe-workshop-contract = { path = "crates/contract" }
fandhe-workshop-core = { path = "crates/core" }
fandhe-workshop-pack = { path = "crates/pack" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
yaml_serde = "0.10.7"
pulldown-cmark = { version = "0.13.4", default-features = false }
# core 等の性質テスト用。dev-dependencies からのみ参照し、配信物（wasm）には入れない。
# fork・timeout を外して依存の木を小さくする。
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# wasm-bindgen CLI と完全一致させるため exact で固定する。版の正は docs/toolchain.md。
wasm-bindgen = "=0.2.128"

# 入力欄の値の書き戻し（crates/web の glue）と履歴の保存先（localStorage・IndexedDB。TASK-317）に使う。
# 版は Cargo.lock の解決済みの版と同じにして、版を動かさない。
# feature は書き戻しに要る型（イベントの種別判定と textarea の値）と、保存先の呼び出しに要る型に絞る。
web-sys = { version = "0.3.105", default-features = false, features = ["Element", "Event", "EventTarget", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "Window", "Location", "Storage", "DomException", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore"] }

# 表示層の基盤（D-30 の採用版）。crates.io から取得するため認証情報は要らない。
# feature は FEND-1 に従い action-keydown だけを明示する（既定の feature は持ち込まない）。
# 推移的な headless-ui・app の版は Cargo.lock が固定する。版上げの運用は TASK-101 で扱う。
fandhe-frontend-wasm-full = { version = "0.46.0", default-features = false, features = ["action-keydown"] }
# wasm-full は次の 3 つを再エクスポートしない。Component・DirtyTracked・BindingSource を
# 実装するために直接参照する。版は Cargo.lock の解決済みの版と同じにして、版を動かさない。
# wasm-client の既定 feature（wasm-bindgen-exports）は、上流の mount・hydrate を書き出して
# 名前の衝突と配信物の肥大を招くため、必ず無効にする。
fandhe-frontend-core = "0.4.3"
fandhe-frontend-interactive = "0.2.7"
fandhe-frontend-wasm-client = { version = "0.6.1", default-features = false }

# 公開 API の文書化と、unsafe・#[allow] の理由の明記を機械で強制する
# （.claude/rules/code-comment-style.md）。make lint は -D warnings で流す。
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

# 依存クレート（workspace メンバー以外）のデバッグ情報を行番号のみにする。
# panic 位置・バックトレース・プロファイラの行番号は残り、失うのはデバッガで依存の
# 変数・型を見る機能だけ。自分たちのクレートは full debuginfo のまま。
[profile.dev.package."*"]
debug = "line-tables-only"

# 配信する wasm の大きさを抑える設定。fandhe-frontend の glue と同じ値にする。
# [profile] はワークスペースのルートにしか書けない（メンバーに書くと無視される）。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
