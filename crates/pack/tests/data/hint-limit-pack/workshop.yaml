# TASK-296（GUIDE-6）の試験用の架空の教材（形式 B）。13 Step に 3 段のヒント（計 39 本）と、水準で段数が変わる 2 Step を置く。
# 出所は形（13 Step x 3 段）だけで、上流の教材の文面・構成は含まない。
# `{{` を含む値は、flow 形式の中で E-PARSE になる罠を避けるため、必ず引用符で囲む（AUTHOR-13）。
pack:
  id: "hint-limit-demo"
  title: "ヒントの上限の試験用教材"
  version: "0.0.1"
  ir_format: 1
  vocab: "1.6"
  guidance: "A"
rejections:
  rj-unknown-command:
    category: "unknown_command"
    message: "この教材の一覧にない操作です。"
    next_action: "今の Step の目的を読み直します。"
  rj-wrong-order:
    category: "wrong_order"
    message: "その操作を使うのは、まだ先です。"
    next_action: "今の Step の目的を読み直します。"
defaults:
  unknown_command: "rj-unknown-command"
  wrong_order: "rj-wrong-order"
