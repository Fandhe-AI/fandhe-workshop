id: c1
title: 7 種の章
starts: [{id: s1, node: a}]
steps:
  - id: a
    title: A
    body: a.md
    views: [v-files, v-doc, v-diff, v-tasks, v-cards, v-checks, v-demo]
    next: [{to: b}]
    input:
      kind: approval
    rules:
      - id: r-approve
        on: {approval: approve}
        outcome:
          kind: accept
          effects:
            - put: {path: notes/draft, fixture: doc-a, attrs: {title: 下書き, detail: 最初の版, state: open}}
            - put: {path: work/deep/leaf/item, attrs: {title: 深い要素, state: todo}}
            - put: {path: work/plain}
            - put: {path: work/gone, attrs: {title: 消える要素}}
      - id: r-decline
        on: {approval: reject}
        outcome: {kind: reject, rejection: rj-decline}
    confirm: {kind: none, reason: 承認そのものが意思表示のため、別の確認を置かない。}
  - id: b
    title: B
    body: b.md
    views: [v-files, v-doc, v-diff, v-tasks, v-cards, v-checks, v-demo]
    final: true
    input:
      kind: approval
    rules:
      - id: r-approve
        on: {approval: approve}
        outcome:
          kind: accept
          effects:
            - set_attr: {path: work/deep/leaf/item, attr: state, value: done}
            - remove: work/gone
            - put: {path: work/new, attrs: {title: 新しい要素, detail: 足した}}
    confirm: {kind: none, reason: 承認そのものが意思表示のため、別の確認を置かない。}
