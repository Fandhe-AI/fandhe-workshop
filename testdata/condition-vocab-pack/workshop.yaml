# 条件の語彙 11 語の網羅用の最小の教材パック（形式 B・YAML。TASK-42 2/2）。
# ST-1.4・CH-2・CH-7・CH-13 の Step の形を、架空の題材で表す。上流の文面は写さない。
# 式やスクリプトを書く欄は持たない。条件は語彙の語（step・flag・world_has・world_attr・count・chose・all・any・
# not・param・clarifying）だけで書く。
pack:
  id: condition-vocab
  title: 条件の語彙の網羅（試験用）
  version: 0.0.1
  ir_format: 1
  guidance: A

commands:
  help: builtin
  new-idea: skill
  start-run: skill
  open-root: skill
  run-all: skill

views:
  v-cards: { kind: card_list }
  v-doc: { kind: document }
  v-tasks: { kind: task_tree }
  v-roots: { kind: task_tree }
  v-prs: { kind: card_list }

clarifications:
  cl-new-idea-name:
    message: 名前が足りません。どんな名前にしますか。
    how_to_answer: 名前を付けてもう一度送るか、Esc で取り消します。

rejections:
  rj-default-unknown-command:
    category: unknown_command
    message: そのコマンドは、この教材の一覧にありません。
    next_action: つづりを確かめます。
  rj-default-wrong-order:
    category: wrong_order
    message: このコマンドは、まだ使う順番ではありません。
    next_action: 今の Step の目的を読みます。
  rj-default-missing-arg:
    category: missing_arg
    message: 必要な引数が足りません。
    next_action: 足りない引数を足して、もう一度送ります。
  rj-default-bad-arg-shape:
    category: bad_arg_shape
    message: 引数または入力の形が合っていません。
    next_action: 小文字・数字・ハイフンだけで書き直します。
  rj-default-busy:
    category: busy
    message: いまは処理中です。
    next_action: 終わるまで待ちます。
  rj-default-not-in-this-step:
    category: not_in_this_step
    message: この Step では使いません。
    next_action: 今の Step の目的を読み直します。
  rj-default-not-supported:
    category: not_supported
    message: この教材では扱いません。
    next_action: 教材の操作に戻ります。
  rj-default-free-text-note:
    category: free_text_unjudged
    message: 書いた内容の良し悪しは、この教材では判定しません。
    next_action: 自分の文を、自分で読み返します。
  rj-miss-point:
    category: not_in_this_step
    message: そこは、変わった箇所ではありません。
    next_action: 左の画面で、変化の印が付いた箇所を指します。
  rj-wrong-answer:
    category: not_in_this_step
    message: その答えは、画面の内容と合いません。
    next_action: 画面をもう一度見て、選び直します。
  rj-nogo:
    category: not_in_this_step
    message: 今はその判定を選べません。
    next_action: 別の選択肢を選びます。
  rj-start-needs-previous:
    category: wrong_order
    message: この開始点は、前の Step を終えてから使えます。
    next_action: 前の Step から始めます。

defaults:
  unknown_command: rj-default-unknown-command
  wrong_order: rj-default-wrong-order
  missing_arg: rj-default-missing-arg
  bad_arg_shape: rj-default-bad-arg-shape
  busy: rj-default-busy
  not_in_this_step: rj-default-not-in-this-step
  not_supported: rj-default-not-supported
  free_text_unjudged: rj-default-free-text-note
