# CH-0〜CH-3 の形を写した作成者向けの試験教材（形式 B）。出所と規則は README.md。
pack:
  id: "ch0-3-author"
  title: "CH-0〜CH-3 の作成者向けの試験教材（20 Step）"
  version: "0.0.1"
  ir_format: 2
  guidance: "A"

commands:
  advance-phase: "flow"
  help: "builtin"
  make-card: "skill"
  new-idea: "skill"
  run-check: "skill"
  sync-cloud: "unsupported"

views:
  v-cards: {"kind": "card_list"}
  v-files: {"kind": "file_tree"}

hints:
  h-0-1: {"level": 1, "text": "右側を選ぶ場面です。"}
  h-1-1: {"level": 1, "text": "使えるコマンドの一覧を出す場面です。"}
  h-1-5: {"level": 1, "text": "処理の途中を待つ場面です。"}

rejections:
  rj-default-bad-arg-shape: {"category": "bad_arg_shape", "message": "引数または入力の形が合っていません。", "next_action": "小文字・数字・ハイフンだけで書き直して、もう一度送ります。"}
  rj-default-busy: {"category": "busy", "message": "いまは処理中です。", "next_action": "終わるまで待つか、Esc で止めます。"}
  rj-default-free-text-note: {"category": "free_text_unjudged", "message": "書いた内容の良し悪しは、この教材では判定しません。", "next_action": "自分の文を、自分で読み返します。"}
  rj-default-missing-arg: {"category": "missing_arg", "message": "必要な引数が足りません。", "next_action": "足りない引数を足して、もう一度送ります。"}
  rj-default-not-in-this-step: {"category": "not_in_this_step", "message": "この Step では使いません。", "next_action": "今の Step の目的を読み直します。"}
  rj-default-not-supported: {"category": "not_supported", "message": "実際の環境ではできますが、この教材では扱いません。", "next_action": "教材の操作に戻ります。"}
  rj-default-unknown-command: {"category": "unknown_command", "message": "そのコマンドは、この教材の一覧にありません。", "next_action": "つづりを確かめるか、/help で使えるコマンドを見ます。"}
  rj-default-wrong-order: {"category": "wrong_order", "message": "このコマンドは、まだ使う順番ではありません。", "next_action": "今の Step の目的を読み、示されたコマンドから始めます。"}
  rj-miss-point: {"category": "not_in_this_step", "message": "そこは、変わった箇所ではありません。", "next_action": "左の画面で、変化の印が付いた箇所を指します。"}
  rj-wrong-answer: {"category": "not_in_this_step", "message": "その答えは、画面の内容と合いません。", "next_action": "画面をもう一度見て、選び直します。"}
  rj-wrong-place: {"category": "not_in_this_step", "message": "その場所は、この Step の対象ではありません。", "next_action": "別の選択肢を選び直します。"}
  rj-need-target: {"category": "not_in_this_step", "message": "直す対象が決まっていません。", "next_action": "対象つきの「直す」を選びます。"}
  rj-too-early: {"category": "not_in_this_step", "message": "まだ承認する段階ではありません。", "next_action": "先に直す対象を決めます。"}
  rj-wrong-row: {"category": "not_in_this_step", "message": "その行は、この Step の対象ではありません。", "next_action": "左の画面で、別の行を指します。"}

clarifications:
  cl-new-idea-name: {"message": "名前が足りません。どんな名前にしますか。", "how_to_answer": "名前を付けてもう一度送るか、Esc で取り消します。"}

defaults:
  bad_arg_shape: "rj-default-bad-arg-shape"
  busy: "rj-default-busy"
  free_text_unjudged: "rj-default-free-text-note"
  missing_arg: "rj-default-missing-arg"
  not_in_this_step: "rj-default-not-in-this-step"
  not_supported: "rj-default-not-supported"
  unknown_command: "rj-default-unknown-command"
  wrong_order: "rj-default-wrong-order"
