# 要素の欠陥 M02。st-2-5 の on_achieved が、どこの put・replace も置かない経路へ set_attr する（土台の章を 1 か所だけ差し替えた）。
id = "ch-d"
title = "備品を作って確かめる"

[[starts]]
id = "s-1"
node = "st-2-1"

[[starts]]
id = "s-7"
node = "st-2-7"

[[steps]]
id = "st-2-1"
title = "場面を読む"
body = "st-2-1.md"
views = ["v-files"]
next = [{ to = "st-2-2" }]
input = { kind = "choice", options = [{ id = "opt-st-2-1", label = "読みました" }] }
rules = [{ id = "r-st-2-1", on = { option = "opt-st-2-1" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "st-2-2"
title = "練習データを開く"
fixtures = ["fx-note"]
next = [{ to = "st-2-3" }]
input = { kind = "choice", options = [{ id = "opt-st-2-2", label = "読みました" }] }
rules = [{ id = "r-st-2-2", on = { option = "opt-st-2-2" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "st-2-3"
title = "ヒントを見る"
hints = ["h-a"]
next = [{ to = "st-2-4" }]
input = { kind = "choice", options = [{ id = "opt-st-2-3", label = "読みました" }] }
rules = [{ id = "r-st-2-3", on = { option = "opt-st-2-3" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "st-2-4"
title = "次へ進む準備をする"
next = [{ to = "st-2-5" }]
input = { kind = "choice", options = [{ id = "opt-st-2-4", label = "読みました" }] }
rules = [{ id = "r-st-2-4", on = { option = "opt-st-2-4" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "st-2-5"
title = "途中の場面"
on_achieved = [{ set_attr = { path = "lost-item", attr = "state", value = "done" } }]
next = [{ to = "st-2-6" }]
input = { kind = "choice", options = [{ id = "opt-st-2-5", label = "読みました" }] }
rules = [{ id = "r-st-2-5", on = { option = "opt-st-2-5" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "st-2-6"
title = "分かれ道の手前"
next = [{ to = "st-2-7" }]
input = { kind = "choice", options = [{ id = "opt-st-2-6", label = "読みました" }] }
rules = [{ id = "r-st-2-6", on = { option = "opt-st-2-6" }, outcome = { kind = "accept" } }]
confirm = { kind = "none", reason = "読むだけの Step のため、選んだこと自体を達成とする。" }

[[steps]]
id = "st-2-7"
title = "備品を作る"
body = "st-2-7.md"
views = ["v-files"]
next = [{ to = "st-2-8" }]
input = { kind = "command", name = "make-item", args = [{ name = "name", positional = true, required = true, shape = "kebab_case" }] }
rules = [{ id = "r-make", on = { command = "make-item" }, outcome = { kind = "accept", effects = [{ put = { path = "items/x", attrs = { state = "created" } } }] } }]
confirm = { kind = "point_at", on_miss = "rj-miss", targets = [{ view = "v-files", path = "items/x" }] }

[[steps]]
id = "st-2-8"
title = "学習モジュールを通る"
use = { module = "mod-outer", instance = "i1", args = {} }
final = true
