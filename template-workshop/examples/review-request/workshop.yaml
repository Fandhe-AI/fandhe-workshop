# 第 2 教材「レビューの頼み方」の骨格（TASK-743）。選択肢と画面操作だけで進み、左に文書のビューだけを出す。
# 練習データ（fixtures）と文書のビューの 5 行は TASK-744 で足した。本文を出さない（G-4）・値を文中に差し込めない（H-3）は
# 限界として受け入れる（D-31）。本文を出す形に直すかは TASK-755 が決める。st-2〜st-8 の正しい経路は TASK-745、誤答への応答は TASK-746 が足す。
pack:
  id: review-request
  title: レビューの頼み方
  version: 0.0.1
  ir_format: 1
  guidance: A
  vocab: "1.3"
  profile:
    command_prefix: ""          # コマンドを持たない（SECOND-9）
    input_field: hidden         # 入力欄・送信ボタンを出さない（SECOND-7）
  appearance:
    theme: reading              # Claude Code 風の外観を使わない（SECOND-10）
  left_pane:
    world_list: hidden          # 世界状態の一覧を出さない（SECOND-8）
    view_tabs: hidden           # ビューの切り替えを出さない（SECOND-8）
commands: {}                    # コマンドを持たない（SECOND-9）
views:
  v-doc: { kind: document }
fixtures:
  fx-draft: { path: fixtures/draft.md, kind: document }
rejections:
  rj-unknown: { category: unknown_command, message: この操作は、この教材にはありません。, next_action: 画面の選択肢から選び直します。 }
  rj-wrong: { category: wrong_order, message: まだ先の手順です。, next_action: 今の手順の選択肢から選びます。 }
  rj-missing: { category: missing_arg, message: 選ぶ内容が足りません。, next_action: 画面の選択肢から選び直します。 }
  rj-bad: { category: bad_arg_shape, message: 決まった形で書かれていません。, next_action: 画面の選択肢から選び直します。 }
  rj-busy: { category: busy, message: 処理中です。, next_action: 終わるまで待ちます。 }
  rj-nis: { category: not_in_this_step, message: この手順では選べません。, next_action: 画面の選択肢から選びます。 }
  rj-ns: { category: not_supported, message: この教材では扱いません。, next_action: 画面の選択肢に戻ります。 }
  rj-ft: { category: free_text_unjudged, message: 書いた内容は判定しません。, next_action: 自分で見直します。 }
  rj-miss-q: { category: not_in_this_step, message: 今は、依頼の下書きを作り始める場面です。, next_action: 状況に合う答えを選び直します。 }
  rj-confirm-wrong: { category: not_in_this_step, message: その答えは、今の場面には合いません。, next_action: 状況に合う答えを選び直します。 }
  rj-miss-to: { category: not_in_this_step, message: そこは宛先の行ではありません。, next_action: 宛先の行を指し直します。 }
  rj-miss-due: { category: not_in_this_step, message: そこは期限の行ではありません。, next_action: 期限の行を指し直します。 }
defaults:
  unknown_command: rj-unknown
  wrong_order: rj-wrong
  missing_arg: rj-missing
  bad_arg_shape: rj-bad
  busy: rj-busy
  not_in_this_step: rj-nis
  not_supported: rj-ns
  free_text_unjudged: rj-ft
