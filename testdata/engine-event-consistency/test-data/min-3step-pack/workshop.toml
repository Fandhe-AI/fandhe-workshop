# PoC-1 の試験データ: 3 Step の最小教材の元（形式 A）。架空のノートの教材で、上流の文面は含まない（D-11）。
# prototype/packs/ には置かない。IR は ../min-3step.json（fandhe-pack compile の出力）。

[pack]
id = "min-3step"
title = "最小 3 Step 教材（PoC-1 試験データ）"
version = "0.0.1"
ir_format = 1
guidance = "A"

[commands]
help = "builtin"
make-note = "skill"
publish-note = "flow"
sync-cloud = "unsupported"

[views.v-files]
kind = "file_tree"

[hints.h-1-1]
level = 1
text = "ノートを新しく作る場面です。"

[hints.h-1-2]
level = 2
text = "使うコマンドは make-note です。"

[hints.h-1-3]
level = 3
text = "/make-note first-note"

[hints.h-2-1]
level = 1
text = "ノートの種類を 1 つ選ぶ場面です。"

[hints.h-3-1]
level = 1
text = "作ったノートを公開してよいかを決める場面です。"

[rejections.rj-default-unknown-command]
category = "unknown_command"
message = "そのコマンドは、この教材の一覧にありません。"
next_action = "つづりを確かめるか、/help で使えるコマンドを見ます。"

[rejections.rj-default-wrong-order]
category = "wrong_order"
message = "このコマンドは、まだ使う順番ではありません。"
next_action = "今の Step の目的を読み、示されたコマンドから始めます。"

[rejections.rj-default-missing-arg]
category = "missing_arg"
message = "必要な引数が足りません。"
next_action = "足りない引数を足して、もう一度送ります。"

[rejections.rj-default-bad-arg-shape]
category = "bad_arg_shape"
message = "引数または入力の形が合っていません。"
next_action = "小文字・数字・ハイフンだけで書き直して、もう一度送ります。"

[rejections.rj-default-busy]
category = "busy"
message = "いまは処理中です。"
next_action = "終わるまで待ちます。終わると、次の入力を受け付けます。"

[rejections.rj-default-not-in-this-step]
category = "not_in_this_step"
message = "この Step では使いません。"
next_action = "今の Step の目的を読み直し、ヒントを開きます。"

[rejections.rj-default-not-supported]
category = "not_supported"
message = "実際の環境ではできますが、この教材では扱いません。"
next_action = "教材の操作に戻ります。"

[rejections.rj-default-free-text-note]
category = "free_text_unjudged"
message = "書いた内容の良し悪しは、この教材では判定しません。"
next_action = "自分の文を、自分で読み返します。"

[rejections.rj-miss-point]
category = "not_in_this_step"
message = "そこは、変わった箇所ではありません。"
next_action = "左の画面で、変化の印が付いた箇所を指します。"

[rejections.rj-decline]
category = "not_in_this_step"
message = "公開しない場合は、この Step を先へ進めません。"
next_action = "公開してよいかをもう一度決めます。"

[defaults]
unknown_command = "rj-default-unknown-command"
wrong_order = "rj-default-wrong-order"
missing_arg = "rj-default-missing-arg"
bad_arg_shape = "rj-default-bad-arg-shape"
busy = "rj-default-busy"
not_in_this_step = "rj-default-not-in-this-step"
not_supported = "rj-default-not-supported"
free_text_unjudged = "rj-default-free-text-note"
