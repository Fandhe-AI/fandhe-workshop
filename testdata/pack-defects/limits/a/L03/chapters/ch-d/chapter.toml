# 静的検査の限界 L03。st-2-7 の先頭の規則が引数を問わず make-item に一致し、後ろの規則（name の値の指定）が決して選ばれない（土台の章を 1 か所だけ差し替えた）。
id = "ch-d"
title = "備品を作って確かめる"

[[starts]]
id = "s-1"
node = "st-2-1"

[[starts]]
id = "s-7"
node = "st-2-7"

[[steps]]
id = "st-2-1"
title = "場面を読む"
body = "st-2-1.md"
views = ["v-files"]
next = [{ to = "st-2-2" }]

[[steps]]
id = "st-2-2"
title = "練習データを開く"
fixtures = ["fx-note"]
next = [{ to = "st-2-3" }]

[[steps]]
id = "st-2-3"
title = "ヒントを見る"
hints = ["h-a"]
next = [{ to = "st-2-4" }]

[[steps]]
id = "st-2-4"
title = "次へ進む準備をする"
next = [{ to = "st-2-5" }]

[[steps]]
id = "st-2-5"
title = "途中の場面"
next = [{ to = "st-2-6" }]

[[steps]]
id = "st-2-6"
title = "分かれ道の手前"
next = [{ to = "st-2-7" }]

[[steps]]
id = "st-2-7"
title = "備品を作る"
body = "st-2-7.md"
views = ["v-files"]
next = [{ to = "st-2-8" }]
input = { kind = "command", name = "make-item", args = [{ name = "name", positional = true, required = true, shape = "kebab_case" }] }
rules = [{ id = "r-make", on = { command = "make-item" }, outcome = { kind = "accept", effects = [{ put = { path = "items/x", attrs = { state = "created" } } }] } }, { id = "r-make-named", on = { command = "make-item", args = { name = "memo" } }, outcome = { kind = "accept", effects = [{ put = { path = "items/x", attrs = { state = "named" } } }] } }]
confirm = { kind = "point_at", on_miss = "rj-miss", targets = [{ view = "v-files", path = "items/x" }] }

[[steps]]
id = "st-2-8"
title = "学習モジュールを通る"
use = { module = "mod-outer", instance = "i1", args = {} }
final = true
