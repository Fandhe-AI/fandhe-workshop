# split-answer-pack の章。3 枚のカードを Step 1 枚ずつに分けて分類させる（PACK-33・D-69）。架空の内容だけを置く。
id: c1
title: 分けた分類
starts: [{id: s1, node: card-a}]
steps:
  - id: card-a
    title: Card A
    body: a.md
    lo: [lo-sort]
    input: {kind: choice, options: [{id: kind-defect, label: 不具合}, {id: kind-look, label: 見た目}, {id: kind-wish, label: 要望}]}
    rules:
      - {id: r-defect, on: {option: kind-defect}, outcome: {kind: accept}}
      - {id: r-look, on: {option: kind-look}, outcome: {kind: accept}}
      - {id: r-wish, on: {option: kind-wish}, outcome: {kind: accept}}
    confirm: {kind: answer, on_wrong: rj-wrong-kind, options: [{id: kind-defect, label: 選択肢 kind-defect, correct: true}, {id: kind-look, label: 選択肢 kind-look, correct: false}, {id: kind-wish, label: 選択肢 kind-wish, correct: false}]}
    next: [{to: card-b}]
  - id: card-b
    title: Card B
    body: a.md
    lo: [lo-sort]
    input: {kind: choice, options: [{id: kind-defect, label: 不具合}, {id: kind-look, label: 見た目}, {id: kind-wish, label: 要望}]}
    rules:
      - {id: r-defect, on: {option: kind-defect}, outcome: {kind: accept}}
      - {id: r-look, on: {option: kind-look}, outcome: {kind: accept}}
      - {id: r-wish, on: {option: kind-wish}, outcome: {kind: accept}}
    confirm: {kind: answer, on_wrong: rj-wrong-kind, options: [{id: kind-defect, label: 選択肢 kind-defect, correct: false}, {id: kind-look, label: 選択肢 kind-look, correct: true}, {id: kind-wish, label: 選択肢 kind-wish, correct: false}]}
    next: [{to: card-c}]
  - id: card-c
    title: Card C
    body: a.md
    lo: [lo-sort]
    input: {kind: choice, options: [{id: kind-defect, label: 不具合}, {id: kind-look, label: 見た目}, {id: kind-wish, label: 要望}]}
    rules:
      - {id: r-defect, on: {option: kind-defect}, outcome: {kind: accept}}
      - {id: r-look, on: {option: kind-look}, outcome: {kind: accept}}
      - {id: r-wish, on: {option: kind-wish}, outcome: {kind: accept}}
    confirm: {kind: answer, on_wrong: rj-wrong-kind, options: [{id: kind-defect, label: 選択肢 kind-defect, correct: false}, {id: kind-look, label: 選択肢 kind-look, correct: false}, {id: kind-wish, label: 選択肢 kind-wish, correct: true}]}
    next: [{to: end}]
  - {id: end, title: End, body: a.md, final: true}
