[package]
name = "fandhe-workshop-web"
description = "ブラウザ向けの表示層（wasm32 で動く。DOM を扱う）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# ブラウザ試験用の入口（debug_* の書き出しと test-hooks.js）を公開する feature。
# 既定は無効で、配信する設定（tools/build-web.sh の既定）では付けない。
test-hooks = ["dep:serde_json"]

[dependencies]
fandhe-workshop-contract.workspace = true
fandhe-workshop-core.workspace = true
fandhe-frontend-wasm-full.workspace = true
fandhe-frontend-core.workspace = true
fandhe-frontend-interactive.workspace = true
fandhe-frontend-wasm-client.workspace = true
fandhe-frontend-headless-ui.workspace = true
fandhe-frontend-wireframe-ui.workspace = true
# 試験の設定の状態の書き出し（engine_snapshot_json）の文字列のエスケープを手書きしないため。配信物には入らない。
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys.workspace = true
js-sys.workspace = true

[dev-dependencies]
# frontend_features の試験が manifest と Cargo.lock を読むため。配信物には入らない。
toml.workspace = true
# doc_links の試験が、手作りの木の試験データ（JSON）を読むため。配信物には入らない。
serde_json.workspace = true
# 履歴の大きさの測定（history_size_all_chapters）が借りる共有部品が `serde::Serialize` を名指すため。試験専用。
serde.workspace = true
# 依存の向きの唯一の例外（docs/architecture.md 第 4 節）。試験専用で、normal 依存にはしない。
fandhe-workshop-pack.workspace = true

[lints]
workspace = true
