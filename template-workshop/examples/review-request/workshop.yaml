# 第 2 教材「レビューの頼み方」の骨格（TASK-743）。選択肢と画面操作だけで進み、左に文書のビューだけを出す。
# 練習データ（fixtures）と文書のビューの 5 行は TASK-744 で足した。本文を出さない（G-4）・値を文中に差し込めない（H-3）は
# 限界として受け入れる（D-31）。本文を出す形に直すかは TASK-755 が決める。st-2〜st-8 の正しい経路は TASK-745、誤答への応答の 8 場面（SECOND-12）は TASK-746 1/2 で足した。誤入力の通しと文面の確認は 2/2 で足した（`tests/playthrough.yaml`・`tests/text-checks.json`）。
pack:
  id: review-request
  title: レビューの頼み方
  version: 0.0.1
  ir_format: 1
  guidance: A
  vocab: "1.3"
  profile:
    command_prefix: ""          # コマンドを持たない（SECOND-9）
    input_field: hidden         # 入力欄・送信ボタンを出さない（SECOND-7）
  appearance:
    theme: reading              # Claude Code 風の外観を使わない（SECOND-10）
  left_pane:
    world_list: hidden          # 世界状態の一覧を出さない（SECOND-8）
    view_tabs: hidden           # ビューの切り替えを出さない（SECOND-8）
commands: {}                    # コマンドを持たない（SECOND-9）
views:
  v-doc: { kind: document }
fixtures:
  fx-draft: { path: fixtures/draft.md, kind: document }
rejections:
  rj-unknown: { category: unknown_command, message: この操作は、この教材にはありません。, next_action: 画面の選択肢から選び直します。 }
  rj-wrong: { category: wrong_order, message: まだ先の手順です。, next_action: 今の手順の選択肢から選びます。 }
  rj-missing: { category: missing_arg, message: 選ぶ内容が足りません。, next_action: 画面の選択肢から選び直します。 }
  rj-bad: { category: bad_arg_shape, message: 決まった形で書かれていません。, next_action: 画面の選択肢から選び直します。 }
  rj-busy: { category: busy, message: 処理中です。, next_action: 終わるまで待ちます。 }
  rj-nis: { category: not_in_this_step, message: この手順では選べません。, next_action: 画面の選択肢から選びます。 }
  rj-ns: { category: not_supported, message: この教材では扱いません。, next_action: 画面の選択肢に戻ります。 }
  rj-ft: { category: free_text_unjudged, message: 書いた内容は判定しません。, next_action: 自分で見直します。 }
  rj-miss-q: { category: not_in_this_step, message: 今は、依頼の下書きを作り始める場面です。, next_action: 状況に合う答えを選び直します。 }
  rj-confirm-wrong: { category: not_in_this_step, message: その答えは、今の場面には合いません。, next_action: 状況に合う答えを選び直します。 }
  rj-miss-to: { category: not_in_this_step, message: そこは宛先の行ではありません。, next_action: 宛先の行を指し直します。 }
  rj-miss-due: { category: not_in_this_step, message: そこは期限の行ではありません。, next_action: 期限の行を指し直します。 }
  rj-q1-feel: { category: not_in_this_step, message: 気持ちだけでは、読む人は何をすればよいか分かりません。, next_action: 読む人が動ける答えを選び直します。 }
  rj-q1-code: { category: not_in_this_step, message: 直した中身は、依頼文ではなく差分で見てもらいます。, next_action: 依頼文に書く内容を選び直します。 }
  rj-q3-all: { category: not_in_this_step, message: 範囲が広いと、読む人は終わりが見えません。, next_action: 範囲を絞る理由を選び直します。 }
  rj-q3-none: { category: not_in_this_step, message: 範囲が書かれていないと、読む人はどこから読めばよいか分かりません。, next_action: 範囲を絞る理由を選び直します。 }
  rj-q4-any: { category: not_in_this_step, message: 観点が多いほど、1 つ 1 つの見方が浅くなります。, next_action: 見てほしい点の決め方を選び直します。 }
  rj-q4-skip: { category: not_in_this_step, message: 見てほしい点がないと、読む人は何を先に見るか決められません。, next_action: 見てほしい点の決め方を選び直します。 }
  rj-q5-to: { category: not_in_this_step, message: 宛先の行は、もう「入力済み」です。, next_action: 状態が「未入力」の行を選び直します。 }
  rj-q5-status: { category: not_in_this_step, message: 状態の行は、項目ではなく下書きの進み具合を表します。, next_action: 状態が「未入力」の行を選び直します。 }
  rj-q7-now: { category: not_in_this_step, message: 見直さずにすぐ送ると、宛先や期限の書き忘れに気付けません。, next_action: 送る前の確かめ方を選び直します。 }
  rj-q7-add: { category: not_in_this_step, message: 送った後に項目を足すと、読む人は変わった点に気付けません。, next_action: 送る前の確かめ方を選び直します。 }
  rj-q8-unsent: { category: not_in_this_step, message: 4 つの項目は、もう揃っています。, next_action: 左の行を見て選び直します。 }
  rj-to-all: { category: not_in_this_step, message: チーム全員に頼むと、誰も自分の担当だと思わず、返事が来ないことがあります。, next_action: この部分に詳しい人を 1 人に絞って選び直します。 }
  rj-row-filled: { category: not_in_this_step, message: その行はもう埋まっています。, next_action: 状態が「未入力」のまま残っている行を指します。 }
  rj-due-short: { category: not_in_this_step, message: 差分と関連するテストの両方を頼んだので、明日の 17 時までは読む量に対して短すぎます。, next_action: 余裕のある期限を選び直します。 }
  rj-due-vague: { category: bad_arg_shape, message: 「できるだけ早く」は、いつまでかが人によって違います。日時が 1 つに決まる形ではありません。, next_action: 日時が 1 つに決まる期限を選び直します。 }
  rj-skip: { category: not_in_this_step, message: 送る前に見直さないと、宛先や期限の書き忘れに気付けません。, next_action: 送る前に見直す選択肢を選び直します。 }
  rj-revise: { category: wrong_order, message: 直す行を決めないまま戻っても、下書きは変わりません。, next_action: 左の行を見て、この内容で送るかを選び直します。 }
defaults:
  unknown_command: rj-unknown
  wrong_order: rj-wrong
  missing_arg: rj-missing
  bad_arg_shape: rj-bad
  busy: rj-busy
  not_in_this_step: rj-nis
  not_supported: rj-ns
  free_text_unjudged: rj-ft
