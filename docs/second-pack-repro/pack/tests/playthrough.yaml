  # 場面 8（続き）: 送って確認まで終えた後に「直す」を選ぶ
  - id: e-fix-after-done
    start: s1
    pre:
      - { choice: opt-start, expect: accepted }
      - { choice: ans-1-ok, expect: achieved }
      - { choice: to-senior, expect: accepted }
      - { ui: "v-doc review/to", expect: achieved }
      - { choice: sc-diff, expect: accepted }
      - { choice: ans-3-ok, expect: achieved }
      - { choice: fc-empty, expect: accepted }
      - { choice: ans-4-ok, expect: achieved }
      - { ui: "v-doc review/deadline", expect: accepted }
      - { choice: ans-5-ok, expect: achieved }
      - { choice: dl-tomorrow, expect: accepted }
      - { ui: "v-doc review/deadline", expect: achieved }
      - { choice: rv-check, expect: accepted }
      - { choice: ans-7-ok, expect: achieved }
      - { choice: act-send, expect: accepted }
      - { choice: ans-8-ok, expect: achieved }
    input: { choice: act-fix, expect: "rejected:not_in_this_step" }
