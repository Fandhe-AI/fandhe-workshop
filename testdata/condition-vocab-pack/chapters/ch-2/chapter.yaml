# CH-2 の形: 8 Step。入力方式は command・text・approval・choice・ui_action・approval。
# 保留（flag）で戻る分岐、選択（chose）と世界状態（world_attr）、論理（all・any・not）を使う。
id: ch-2
title: 題材の工程

starts:
  - { id: s-2-1, node: st-2-1 }

steps:
  - id: st-2-1
    title: 題材を作る
    do: /new-idea に名前を付けて送ります
    views: [v-doc]
    next: [{ to: st-2-2 }]
    input:
      kind: command
      name: new-idea
      args:
        - { name: name, positional: true, required: true, shape: kebab_case }
    rules:
      - id: r-create
        on: { command: new-idea, args: { name: sample-topic } }
        outcome:
          kind: accept
          effects:
            - put: { path: topics/sample/readme, attrs: { status: draft } }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: topics/sample/readme }]
      on_miss: rj-miss-point

  - id: st-2-2
    title: 狙いを書く
    do: 狙いを文で書いて送ります
    views: [v-doc]
    on_enter: [{ clear_flag: hold }]
    processing:
      - { name: gen-heading }
      - name: gen-done
        effects:
          - set_attr: { path: topics/sample/readme, attr: status, value: written }
    next: [{ to: st-2-3 }]
    input: { kind: text, min: 10, max: 2000 }
    rules:
      - id: r-write
        on: { text: true }
        outcome: { kind: accept, effects: [] }
    confirm:
      kind: answer
      on_wrong: rj-wrong-answer
      options:
        - { id: ans-a, correct: true }
        - { id: ans-b, correct: true }

  - id: st-2-3
    title: 追求判定
    do: 承認の操作で、判定に答えます
    views: [v-doc]
    next:
      - { to: st-2-2, when: { any: [{ flag: hold }, { flag: hold-again }] } }
      - { to: st-2-4 }
    input: { kind: approval }
    rules:
      - id: r-go
        on: { approval: approve }
        outcome:
          kind: accept
          effects:
            - set_attr: { path: topics/sample/readme, attr: status, value: approved }
      - id: r-nogo
        on: { approval: reject }
        outcome: { kind: reject, rejection: rj-nogo }
      - id: r-hold
        on: { approval: revise }
        outcome: { kind: accept, effects: [{ set_flag: hold }] }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: "topics/sample/readme#status" }]
      on_miss: rj-miss-point

  - id: st-2-4
    title: 候補を選ぶ
    do: 検証したい候補を、選択肢から 1 つ選びます
    views: [v-doc]
    next: [{ to: st-2-5 }]
    input:
      kind: choice
      options:
        - { id: cand-a, label: 候補 A }
        - { id: cand-b, label: 候補 B }
    rules:
      - id: r-a
        on: { option: cand-a }
        outcome:
          kind: accept
          effects:
            - put: { path: topics/sample/plan, attrs: { variant: a } }
            - clear_flag: variant_miss
      - id: r-b
        on: { option: cand-b }
        outcome:
          kind: accept
          effects:
            - put: { path: topics/sample/plan, attrs: { variant: b } }
            - set_flag: variant_miss
    confirm:
      kind: none
      reason: 候補を選ぶこと自体が目的で、左の変化を指す学習目標がない。

  - id: st-2-5
    title: 結果を判断する
    do: 結果カードを読み、Go か戻る工程を選びます
    views: [v-doc]
    on_enter:
      - when: { flag: variant_miss }
        put: { path: topics/sample/result, attrs: { verdict: miss } }
      - when: { not: { flag: variant_miss } }
        put: { path: topics/sample/result, attrs: { verdict: ok } }
    next:
      - { to: st-2-4, when: { all: [{ chose: { step: st-2-5, option: back-plan } }, { not: { flag: abandoned } }] } }
      - { to: st-2-6 }
    input:
      kind: choice
      options:
        - { id: go, label: Go }
        - { id: back-plan, label: 検証計画に戻る }
    rules:
      - id: r-go-ok
        on: { option: go }
        when: { world_attr: { path: topics/sample/result, attr: verdict, eq: ok } }
        outcome: { kind: accept, effects: [] }
      - id: r-go-miss
        on: { option: go }
        when: { world_attr: { path: topics/sample/result, attr: verdict, eq: miss } }
        outcome: { kind: reject, rejection: rj-nogo }
      - id: r-back
        on: { option: back-plan }
        outcome: { kind: accept, effects: [] }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: "topics/sample/result#verdict" }]
      on_miss: rj-miss-point

  - id: st-2-6
    title: 期待を直す
    do: 曖昧な期待を直す差し戻しをします
    views: [v-doc]
    next: [{ to: st-2-7 }]
    input: { kind: approval }
    rules:
      - id: r-revise
        on: { approval: revise, target: expect }
        outcome: { kind: accept, effects: [{ set_flag: revised }] }
      - id: r-approve-early
        on: { approval: approve }
        outcome: { kind: reject, rejection: rj-nogo }
    confirm: { kind: approve }

  - id: st-2-7
    title: タスクを指す
    do: タスクの一覧から TASK-1 の行を指します
    views: [v-tasks]
    next: [{ to: st-2-8 }]
    input:
      kind: ui_action
      targets:
        - { view: v-tasks, path: TASK-1 }
        - { view: v-tasks, path: TASK-2 }
    rules:
      - id: r-task1
        on: { ui: { view: v-tasks, path: TASK-1 } }
        outcome:
          kind: accept
          effects:
            - put: { path: topics/sample/tasks, attrs: { picked: task-1 } }
      - id: r-task2
        on: { ui: { view: v-tasks, path: TASK-2 } }
        outcome: { kind: reject, rejection: rj-nogo }
    confirm:
      kind: answer
      on_wrong: rj-wrong-answer
      options:
        - { id: ans-1, correct: true }
        - { id: ans-2, correct: false }

  - id: st-2-8
    title: 着手を判定する
    do: 承認の操作で、着手判定に答えます
    views: [v-doc]
    final: true
    input: { kind: approval }
    rules:
      - id: r-approve
        on: { approval: approve }
        outcome:
          kind: accept
          effects:
            - set_attr: { path: topics/sample/readme, attr: status, value: started }
    confirm:
      kind: point_at
      targets: [{ view: v-doc, path: "topics/sample/readme#status" }]
      on_miss: rj-miss-point
