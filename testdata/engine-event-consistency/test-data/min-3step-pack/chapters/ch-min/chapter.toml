# 3 Step の最小教材: コマンド＋引数、選択、承認の操作を 1 つずつ。
id = "ch-min"
title = "ノートを作って公開する（最小）"

[[starts]]
id = "s-1"
node = "st-1"

# Step 1: コマンド＋引数。受付の後に 5 段の進行（処理中）があり、変化した箇所を指して確認する。
[[steps]]
id = "st-1"
title = "ノートを作る"
body = "st-1.md"
lo = ["LO-1"]
views = ["v-files"]
hints = ["h-1-1", "h-1-2", "h-1-3"]
next = [{ to = "st-2" }]
processing = [
  { name = "p1-prepare" },
  { name = "p2-create" },
  { name = "p3-write", effects = [{ set_attr = { path = "notes/draft", attr = "state", value = "writing" } }] },
  { name = "p4-check" },
  { name = "p5-save", effects = [{ set_attr = { path = "notes/draft", attr = "state", value = "saved" } }] },
]

[steps.input]
kind = "command"
name = "make-note"
args = [{ name = "name", positional = true, required = true, shape = "kebab_case" }]

[[steps.rules]]
id = "r-make"
on = { command = "make-note" }
outcome = { kind = "accept", effects = [{ put = { path = "notes/draft", attrs = { state = "created", kind = "none" } } }] }

[steps.confirm]
kind = "point_at"
on_miss = "rj-miss-point"
targets = [{ view = "v-files", path = "notes/draft" }]

# Step 2: 選択。選ぶこと自体が確認なので、確認を省くと明示する（受付と同時に達成になる）。
[[steps]]
id = "st-2"
title = "ノートの種類を選ぶ"
body = "st-2.md"
lo = ["LO-2"]
views = ["v-files"]
hints = ["h-2-1"]
next = [{ to = "st-3" }]

[steps.input]
kind = "choice"
options = [{ id = "opt-memo", label = "メモ" }, { id = "opt-todo", label = "やること" }]

[[steps.rules]]
id = "r-memo"
on = { option = "opt-memo" }
outcome = { kind = "accept", effects = [{ set_attr = { path = "notes/draft", attr = "kind", value = "memo" } }] }

[[steps.rules]]
id = "r-todo"
on = { option = "opt-todo" }
outcome = { kind = "accept", effects = [{ set_attr = { path = "notes/draft", attr = "kind", value = "todo" } }] }

[steps.confirm]
kind = "none"
reason = "選択そのものが意思表示で、選んだ結果は左の画面にすぐ出るため、別の確認を置かない。"

# Step 3: 承認の入力。受付の後に、承認の確認の操作をして初めて達成になる。
[[steps]]
id = "st-3"
title = "ノートを公開する"
body = "st-3.md"
lo = ["LO-3"]
final = true
views = ["v-files"]
hints = ["h-3-1"]

[steps.input]
kind = "approval"

[[steps.rules]]
id = "r-approve"
on = { approval = "approve" }
outcome = { kind = "accept", effects = [{ set_attr = { path = "notes/draft", attr = "state", value = "published" } }] }

[[steps.rules]]
id = "r-decline"
on = { approval = "reject" }
outcome = { kind = "reject", rejection = "rj-decline" }

[steps.confirm]
kind = "approve"
