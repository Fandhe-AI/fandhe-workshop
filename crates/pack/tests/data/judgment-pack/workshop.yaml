# PACK-11 の試験用の架空の教材（形式 B）。誤入力の期待の読み取りと拒否の文面の検査に使う。
# 上流の教材（bbs-tutorial）の文面・構成は含まない（D-11）。
pack:
  id: "judgment-demo"
  title: "判定の分類の試験用教材"
  version: "0.0.1"
  ir_format: 1
  guidance: "A"
commands:
  help: "builtin"
  make-idea: "skill"
  start-run: "flow"
  publish-run: "flow"
  sync-cloud: "unsupported"
clarifications:
  cl-idea-name:
    message: "アイデアの名前が足りません。どんな名前にしますか。"
    how_to_answer: "名前を付けて、もう一度送ります。"
rejections:
  rj-default-unknown-command:
    category: "unknown_command"
    message: "そのコマンドは、この教材の一覧にありません。"
    next_action: "つづりを確かめるか、/help で使えるコマンドを見ます。"
  rj-default-wrong-order:
    category: "wrong_order"
    message: "このコマンドは、まだ使う順番ではありません。"
    next_action: "今の Step の目的を読み、示されたコマンドから始めます。"
  rj-default-missing-arg:
    category: "missing_arg"
    message: "必要な引数が足りません。"
    next_action: "足りない引数を足して、もう一度送ります。"
  rj-default-bad-arg-shape:
    category: "bad_arg_shape"
    message: "引数の形が合っていません。"
    next_action: "示された形で書き直して、もう一度送ります。"
  rj-default-busy:
    category: "busy"
    message: "いまは処理中です。"
    next_action: "終わるまで待ちます。"
  rj-default-not-in-this-step:
    category: "not_in_this_step"
    message: "この Step では使いません。"
    next_action: "今の Step の目的を読み直します。"
  rj-default-not-supported:
    category: "not_supported"
    message: "実際の環境ではできますが、この教材では扱いません。"
    next_action: "教材の操作に戻ります。"
  rj-default-free-text-note:
    category: "free_text_unjudged"
    message: "書いた内容の良し悪しは、この教材では判定しません。"
    next_action: "自分の文を、自分で読み返します。"
  rj-run-missing-mode:
    category: "missing_arg"
    message: "実行の番号のほかに、実行の種類も必要です。"
    next_action: "番号の後ろに種類を足して、もう一度送ります。"
defaults:
  unknown_command: "rj-default-unknown-command"
  wrong_order: "rj-default-wrong-order"
  missing_arg: "rj-default-missing-arg"
  bad_arg_shape: "rj-default-bad-arg-shape"
  busy: "rj-default-busy"
  not_in_this_step: "rj-default-not-in-this-step"
  not_supported: "rj-default-not-supported"
  free_text_unjudged: "rj-default-free-text-note"
